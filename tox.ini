[tox]
# Version envs mirror the CI matrix in
# .github/workflows/python-package.yml.  3.15 is still a pre-release; tox
# skips it unless a 3.15 interpreter is on PATH.
envlist = 3.15,3.14,3.13,3.12,3.11,3.10,flake8,apicheck,configcheck,typecheck,docstyle,bandit,spell

[testenv]
deps=
    -r{toxinidir}/requirements/requirements.txt
    -r{toxinidir}/requirements/test.txt
    -r{toxinidir}/requirements/ci.txt

    linkcheck,apicheck,configcheck: -r{toxinidir}/requirements/docs.txt
    spell: -r{toxinidir}/requirements/spell.txt
    flake8,docstyle: -r{toxinidir}/requirements/dist.txt
    bandit: bandit
passenv = http_proxy HTTP_PROXY https_proxy HTTPS_PROXY no_proxy NO_PROXY
sitepackages = False
recreate = False
commands = py.test --random-order --open-files -xvv --cov=faust tests/unit tests/functional tests/integration tests/meticulous/ tests/regression

# One interpreter per version env, and a single pinned one for the checks.
# The previous form repeated the whole check list (flake8, typecheck, ...) on
# all three lines, so every one of those factors matched all three at once and
# tox resolved `base_python` to nothing -- leaving the checks on whatever
# interpreter happened to be running tox.  That is silently version-dependent
# for `typecheck`.  They now pin to 3.12, the PYTHON_LATEST the CI workflow
# runs its lint job on.
basepython =
    3.15: python3.15
    3.14: python3.14
    3.13: python3.13
    3.12: python3.12
    3.11: python3.11
    3.10: python3.10
    flake8,apicheck,linkcheck,configcheck,typecheck,docstyle,bandit,spell: python3.12

[testenv:apicheck]
setenv =
    APICHECK=1
commands =
    sphinx-build -b apicheck -d {envtmpdir}/doctrees2 docs docs/_build/apicheck

[testenv:configcheck]
commands =
    sphinx-build -b configcheck -d {envtmpdir}/doctrees2 docs docs/_build/configcheck
    python extra/tools/verify_doc_defaults.py

[testenv:linkcheck]
commands =
    sphinx-build -b linkcheck -d {envtmpdir}/doctrees2 docs docs/_build/linkcheck

[testenv:spell]
commands =
    env SPELLCHECK=1 sphinx-build -b spelling -d {envtmpdir}/doctrees2 docs docs/_build/spell

[testenv:flake8]
commands =
    flake8 {toxinidir}/faust {toxinidir}/t {toxinidir}/examples

[testenv:typecheck]
commands =
    mypy -p faust

[testenv:docstyle]
commands =
    pydocstyle --match-dir '(?!types|assignor)' faust

[testenv:bandit]
commands =
    bandit -b extra/bandit/baseline.json -c extra/bandit/config.yaml -r faust
