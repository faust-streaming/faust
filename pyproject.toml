[project]
name = "faust-streaming"
description = "Python Stream Processing. A Faust fork"
requires-python = ">=3.10"
dynamic = [
    "version",
    "optional-dependencies",
    "dependencies",

]
readme = "README.md"
license = { file = "LICENSE" }
keywords = [
    "stream",
    "processing",
    "asyncio",
    "distributed",
    "queue",
    "kafka",
]
classifiers = [
    "Framework :: AsyncIO",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: BSD",
    "Operating System :: Microsoft :: Windows",
    "Topic :: System :: Networking",
    "Topic :: System :: Distributed Computing",
]

authors = [
    { name = "Ask Solem Hoel", email= "ask@robinhood.com" },
    { name = "Vineet Goel", email= "vineet@robinhood.com" },
]

maintainers = [
    { name = "Vikram Patki", email = "vpatki@wayfair.com" },
    { name = "William Barnhart", email = "williambbarnhart@gmail.com" },
]

[project.scripts]
faust = "faust.cli.faust:cli"

[project.urls]
Documentation = "https://faust-streaming.github.io/faust/"
Source = "https://github.com/faust-streaming/faust"
Changes = "https://github.com/faust-streaming/faust/releases"

[build-system]
requires = [
    # setuptools >= 69 normalizes the sdist filename per PEP 625
    # (faust_streaming-*.tar.gz), which PyPI now requires.
    "setuptools>=69",
    "setuptools_scm[toml]",
    "wheel",
    "cython>=0.29; implementation_name == 'cpython'",
    "cython>=3.0.0; implementation_name == 'cpython' and python_version >= '3.12'",
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
# enables setuptools_scm to provide the dynamic version

[tool.flake8]
ignore = [
    "W503",
    "E203",
    "E231",
    "E225",
    "B305",
]
max-line-length = 88

[tool.isort]
profile = "black"
combine_as_imports = true

[tool.mypy]
ignore_missing_imports = true
disallow_untyped_defs = true
# Pinned so the result does not depend on which interpreter runs mypy.  Without
# it mypy targets the running version, and typeshed differs enough between them
# that a contributor on 3.10 and the lint job on PYTHON_LATEST would disagree
# about whether the tree is clean.  Tracks the lint job's interpreter; raising
# it can surface new errors, so bump it deliberately.
python_version = "3.12"

# Type-checking ratchet.
#
# `scripts/check` runs `mypy -p faust`, so it has to exit zero.  The package is
# not clean yet, so the modules that still have errors are silenced here.
# Everything NOT listed is checked -- today that is 86 of faust's 164 modules,
# plus every module added from here on.
#
# This list may only shrink.  Do not add a module to it to turn a red build
# green; fix the annotations instead.  When you clean one up, delete its line
# in the same pull request so it cannot regress.  To see what is outstanding,
# comment this section out and run `mypy -p faust`.
#
# Regenerating it requires the pinned mypy from requirements/typecheck.txt; a
# different version reports a different set.
[[tool.mypy.overrides]]
module = [
  "faust",
  "faust.agents.agent",
  "faust.app._attached",
  "faust.app.base",
  "faust.app.router",
  "faust.assignor.client_assignment",
  "faust.assignor.partition_assignor",
  "faust.auth",
  "faust.channels",
  "faust.cli.base",
  "faust.cli.worker",
  "faust.contrib.sentry",
  "faust.events",
  "faust.livecheck.app",
  "faust.livecheck.case",
  "faust.livecheck.signals",
  "faust.models.base",
  "faust.models.fields",
  "faust.models.record",
  "faust.models.typing",
  "faust.sensors.base",
  "faust.sensors.datadog",
  "faust.sensors.distributed_tracing",
  "faust.sensors.monitor",
  "faust.sensors.prometheus",
  "faust.sensors.statsd",
  "faust.serializers.codecs",
  "faust.serializers.schemas",
  "faust.stores.aerospike",
  "faust.stores.base",
  "faust.stores.rocksdb",
  "faust.streams",
  "faust.tables.base",
  "faust.tables.globaltable",
  "faust.tables.manager",
  "faust.tables.objects",
  "faust.tables.recovery",
  "faust.tables.sets",
  "faust.tables.table",
  "faust.topics",
  "faust.transport.conductor",
  "faust.transport.consumer",
  "faust.transport.drivers.aiokafka",
  "faust.transport.drivers.confluent",
  "faust.transport.producer",
  "faust.transport.utils",
  "faust.types.agents",
  "faust.types.app",
  "faust.types.auth",
  "faust.types.channels",
  "faust.types.codecs",
  "faust.types.models",
  "faust.types.sensors",
  "faust.types.serializers",
  "faust.types.settings.params",
  "faust.types.settings.settings",
  "faust.types.stores",
  "faust.types.streams",
  "faust.types.tables",
  "faust.types.topics",
  "faust.types.transports",
  "faust.types.tuples",
  "faust.types.web",
  "faust.utils._opentracing",
  "faust.utils.agent_stopper",
  "faust.utils.codegen",
  "faust.utils.cron",
  "faust.utils.terminal.tables",
  "faust.utils.tracing",
  "faust.utils.venusian",
  "faust.web.base",
  "faust.web.blueprints",
  "faust.web.cache.backends.redis",
  "faust.web.cache.cache",
  "faust.web.drivers.aiohttp",
  "faust.web.views",
  "faust.windows",
  "faust.worker",
]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
minversion = "6.0"
addopts = [
  "--cov-report=term-missing:skip-covered",
  "--cov=faust",
  "-rxXs",
  "--strict-config",
  "--strict-markers",
]
filterwarnings = [
    "error::ResourceWarning",
]
xfail_strict = true

testpaths = [
    "tests",
    "integration",
]


[tool.cibuildwheel]
build = "cp3*"

archs = ["auto64"]
# Skip musllinux, and skip the free-threaded builds (cp313t/cp314t): as of
# cibuildwheel 3.1 free-threading is no longer experimental for 3.14, so
# `cp3*` would otherwise build free-threaded wheels for the Cython extension,
# which has not been validated under a no-GIL interpreter.  Drop `cp31?t-*`
# from this list once faust is verified free-threading-safe.
skip = ["*musllinux*", "cp31?t-*"]

before-build = "pip install Cython"

manylinux-x86_64-image = "manylinux2014"
manylinux-pypy_x86_64-image = "manylinux2014"
