---
name: CI/CD
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Run the checks on merge-queue candidates too, so the merge queue enabled
  # on `master` can validate each candidate as a `merge_group` event -- the
  # required `check` job must run there or queued PRs stall.
  merge_group:
  release:
    types: [created]
    branches: [master]
env:
  FORCE_COLOR: '1'  # Make tools pretty.
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_PYTHON_VERSION_WARNING: '1'
  PYTHON_LATEST: '3.12'
# One run per pull request at a time: a new push supersedes the run of the
# commit it replaces, so a full matrix is not spent validating a commit nobody
# will ever merge.
#
# Cancellation is deliberately limited to `pull_request`.  Every other event
# gets its own group and always runs to completion: a cancelled `merge_group`
# candidate would stall the merge queue, a cancelled `release` would skip
# publishing, and `push` runs on master are what seed the caches everything
# else restores from.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  lint:
    name: Check linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-faust
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          # isort/black/flake8 read the source tree and `mypy -p faust`
          # type-checks it in place, so nothing here needs faust installed.
          install: none
      - name: Run linting checks
        run: scripts/check

  test-pytest:
    name: 'Python ${{ matrix.python-version }}/Cython: ${{ matrix.use-cython }}'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Complete all jobs even if one fails, so we can see for example if a
      # test fails only when Cython is enabled.
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
        use-cython: ['true', 'false']
    # Python 3.15 is advisory for two reasons.  The pre-release one is that rc2
    # and final are still to come (`allow-prereleases` in the composite action
    # resolves `3.15` to whatever the runner image publishes, with no change
    # needed here once it ships).  The specific one is that faust does not
    # import at all on 3.15 until mode-streaming ships the fix for
    # `typing._eval_type`, whose `type_params` argument became a required
    # positional in 3.15 -- every faust Record model resolves its annotations
    # through `mode.utils.objects.annotations`, so collection dies before the
    # first test runs.  The fix is on mode's master; drop 3.15 from this
    # expression to make it required once a mode-streaming release carries it
    # (and bump the floor in requirements/requirements.txt then).
    continue-on-error: ${{ matrix.python-version == '3.15' }}
    env:
      USE_CYTHON: ${{ matrix.use-cython }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-faust
        with:
          python-version: ${{ matrix.python-version }}
          # ckafka on every leg that can install it, so the confluent driver's
          # unit tests -- tests/unit/transport/drivers/test_confluent.py, which
          # `importorskip`s on confluent_kafka -- actually run.  They are
          # broker-less tests over a pure-Python wrapper and add ~2s to a leg
          # that already installs and runs everything else; they used to get
          # six dedicated jobs, each paying a full checkout and install for six
          # seconds of tests.
          #
          # Except on 3.15: confluent-kafka publishes no cp315 wheel yet, so
          # the install falls back to its sdist, which needs the librdkafka
          # headers that are not on the runner -- the build dies on "fatal
          # error: librdkafka/rdkafka.h: No such file or directory" and takes
          # the whole leg's install down with it.  Drop this condition once a
          # cp315 wheel ships.  (The empty line the false branch produces is
          # skipped by the action's reader.)
          requirements: |
            requirements/test.txt
            ${{ matrix.python-version != '3.15' && 'requirements/extras/ckafka.txt' || '' }}
          build-ext: ${{ matrix.use-cython }}
      - name: Run tests
        # FAUST_REQUIRE_CYTHON turns a silent fallback into a failure, so this
        # leg cannot quietly go back to testing pure Python if the build stops
        # producing importable extensions.  See
        # tests/unit/test_cython_parity.py.
        env:
          FAUST_REQUIRE_CYTHON: ${{ matrix.use-cython == 'true' && '1' || '' }}
        run: scripts/tests
      - name: Enforce coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  test-freethreading:
    name: 'Python ${{ matrix.python-version }} (free-threaded)'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The two interpreters `[tool.cibuildwheel]` publishes free-threaded
        # wheels for.  Keep the two lists in step: a version we ship a wheel
        # for is a version this job has to cover.
        python-version: ['3.13t', '3.14t']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-faust
        with:
          python-version: ${{ matrix.python-version }}
          # Not requirements/test.txt: parts of it cannot be built on a
          # free-threaded interpreter at all (twine -> cffi, and hypothesis'
          # PyO3 extension on 3.13t).  freethreading.txt is that list minus
          # the ones that fail, and documents each omission.  build.txt is the
          # toolchain the editable `--no-build-isolation` install needs on the
          # ambient interpreter, including the `Cython>=3.1` floor that makes
          # `freethreading_compatible` take effect.
          requirements: |
            requirements/freethreading.txt
            requirements/build.txt
          install: editable
          build-ext: 'true'
      - name: Verify the extensions did not silently re-enable the GIL
        # Fails loudly if an extension is missing `freethreading_compatible`,
        # rather than leaving it to a RuntimeWarning nobody reads.  Runs
        # before the suite so the cause is obvious when it breaks.
        run: python -m pytest tests/unit/test_free_threading.py -v --no-cov
      - name: Run tests
        # PYTHON_GIL=0 keeps the GIL off for the whole run even if some
        # *dependency* re-enables it (aiokafka's _crecords does, today), so
        # the suite really is exercised without a GIL rather than quietly
        # falling back to one.
        #
        # Deliberately serial, unlike scripts/tests: this job exists to
        # exercise faust's own threading behaviour under a single no-GIL
        # interpreter, and sharding the suite across xdist worker *processes*
        # would spread that across several interpreters instead.
        env:
          PYTHON_GIL: '0'
          # As in the main matrix: fail rather than silently fall back to pure
          # Python if the extensions stop being importable from the tree.
          FAUST_REQUIRE_CYTHON: '1'
        run: python -m pytest tests/unit tests/functional -q --no-cov

  test-pypy:
    name: 'Python pypy3.11/Cython: false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Advisory, and master-only.  PyPy exercises the pure-Python paths that
    # the CPython legs already cover, its result gates nothing
    # (`continue-on-error`, and it is not in `check`'s `needs`), and it was
    # comfortably the most expensive job in the workflow -- ~7.5 minutes,
    # around 15% of every pull request's CI time, for a signal no one can
    # block on.  Running it on `push` keeps the coverage per *merged commit*
    # identical, since master only ever advances through this workflow.
    if: github.event_name == 'push'
    continue-on-error: true
    env:
      USE_CYTHON: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-faust
        id: setup
        continue-on-error: true
        with:
          python-version: pypy3.11
      - name: Run tests
        if: steps.setup.outcome == 'success'
        # `scripts/tests` also runs bandit after pytest, and pytest coverage
        # on PyPy is expensive enough to push this advisory leg into the
        # timeout.  Run pytest directly without coverage, and stop at the
        # first failure so a red job reports the real test error instead of a
        # timeout.
        run: >
          python -m pytest tests/unit tests/functional tests/integration
          tests/meticulous tests/regression -x --no-cov -n auto

  test-integration:
    name: 'Integration (Kafka ${{ matrix.kafka-version }})'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Advisory for now: service-backed tests can be flaky while we stabilise
    # them, so a red here must not block the required checks / the merge
    # queue.  This job is intentionally NOT in the `check` job's `needs`.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # Test against both a 3.x broker and Kafka 4.x (KRaft-only, released
        # 2025).  The `KAFKA_CONTROLLER_QUORUM_VOTERS` static-voter config
        # below works for both.
        kafka-version: ['3.8.1', '4.0.0']
    services:
      # Redis rides along rather than getting a job of its own: the cache
      # tests take about five seconds, and standing up a whole runner for them
      # cost ten times as much as the tests themselves.  `tests/integration`
      # below runs both suites, and each one skips itself when its service is
      # unreachable, so neither can quietly pass by not running.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Run Kafka as a plain container (not a GH `services:` container) so its
      # very chatty broker log stays inside the container -- retrievable on
      # demand via `docker logs` -- and the job log shows the pytest output.
      - name: Start Kafka (KRaft, single node)
        run: |
          docker run -d --name kafka -p 9092:9092 \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
            -e KAFKA_AUTO_CREATE_TOPICS_ENABLE=true \
            apache/kafka:${{ matrix.kafka-version }}
      # Starting the broker before installing means the container boots while
      # uv resolves, and the wait below is usually already satisfied.
      - uses: ./.github/actions/setup-faust
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          requirements: |
            requirements/test.txt
            requirements/extras/ckafka.txt
      - name: Wait for Kafka to be ready
        run: |
          # 60 * (up to 2s connect + 2s sleep) -- the same ~120s ceiling the
          # previous Python version of this step used.  stderr is dropped
          # because a refused connection is the expected state while the
          # broker boots, and 60 "Connection refused" lines are just noise.
          for _ in $(seq 60); do
            if timeout 2 bash -c '</dev/tcp/localhost/9092' 2>/dev/null; then
              echo "Kafka port is open"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Kafka did not become reachable in time"
          exit 1
      - name: Run service-backed integration tests
        env:
          FAUST_TEST_BROKER: 'kafka://localhost:9092'
          FAUST_TEST_REDIS: 'redis://localhost:6379'
        run: pytest tests/integration -v -ra --tb=short --no-cov
      # Only the tail of the broker log on failure, so it augments rather than
      # buries the pytest output in the job log.
      - name: Kafka broker logs (on failure)
        if: failure()
        run: docker logs --tail 40 kafka

  check:  # This job does nothing and is only used for the branch protection
    name: ✅ Ensure the required checks passing
    if: always()
    # test-freethreading gates too: `[tool.cibuildwheel]` publishes cp313t and
    # cp314t wheels, and a wheel we ship should not be able to go out on a red
    # run.  (test-integration and test-pypy stay out of this list -- they are
    # advisory.)
    needs: [lint, test-pytest, test-freethreading]
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}

  build_wheels:
    name: 📦 Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: check
    if: github.event_name == 'release' && github.event.action == 'created'
    strategy:
      matrix:
        # Modern, supported runner images (ubuntu-20.04 was retired in 2025).
        # macos-15-intel -> x86_64 wheels, macos-14 -> arm64 wheels,
        # windows-2022 -> AMD64 wheels. Build config lives in
        # pyproject.toml's [tool.cibuildwheel] (cp3*, auto64, Cython).
        os: [ubuntu-latest, macos-15-intel, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build wheels
        # 4.2.0 is the first pin that knows about CPython 3.15, and it builds
        # cp315 by default -- no `CIBW_ENABLE: cpython-prerelease` needed,
        # because cibuildwheel gates a Python behind that group only until its
        # first release candidate (the ABI is frozen at rc1, so a wheel built
        # against 3.15.0rc1 is forward-compatible with 3.15.0 final).  The
        # `cp31?t-*` skip in pyproject.toml's [tool.cibuildwheel] keeps this
        # to cp315, without cp315t, matching the other versions.
        uses: pypa/cibuildwheel@v4.2.0
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  build_sdist:
    name: 📦 Build the source distribution
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'release' && github.event.action == 'created'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_LATEST }}
      - name: Build sdist
        # Use `python -m build`, not the deprecated `setup.py sdist`, so the
        # sdist is named with the normalized project name
        # (`faust_streaming-*.tar.gz`).  PyPI enforces PEP 625 and rejects the
        # legacy hyphenated `faust-streaming-*.tar.gz`.
        run: |
          python -m pip install build pkgconfig cython --upgrade
          python -m build --sdist --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: 📦 Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build_wheels, build_sdist]
    permissions:
      id-token: write
    environment: pypi
    if: github.event_name == 'release' && github.event.action == 'created'
    steps:
      - name: Download all build artifacts (sdist + every wheel)
        uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          merge-multiple: true
          path: dist
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
